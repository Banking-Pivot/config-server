apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  labels:
    app: config-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      # Kubernetes would add one variable per Service of the namespace (API_GATEWAY_PORT=tcp://...);
      # the services are found by name, so those variables are left out.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: config-server
          # Built with: ./mvnw clean verify && docker build -t config-server:0.0.1-SNAPSHOT .
          image: config-server:0.0.1-SNAPSHOT
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8888
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "native"
            - name: CONFIG_NATIVE_LOCATIONS
              value: "file:/config/"
            - name: SPRING_CLOUD_VAULT_ENABLED
              value: "false"
            - name: EUREKA_URL
              value: "http://discovery-server:8761/eureka/"
            - name: EUREKA_INSTANCE_HOSTNAME
              value: "config-server"
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          # The service is up when it listens: a slow start gets five minutes before the pod is
          # restarted, and traffic only arrives while the port answers.
          startupProbe:
            tcpSocket:
              port: 8888
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 8888
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 300Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        # ConfigMap generated from the banking-config repository (kubectl apply -k). Each key
        # is one file: /config/application.yml, /config/account-service.yml, ...
        - name: config
          configMap:
            name: banking-config
